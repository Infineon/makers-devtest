name: Spellcheck Action
on: 
  pull_request:
  push:
  
jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: rojopolis/spellcheck-github-actions@0.51.0
      name: Spellcheck
      with:
        config_path: .github/spellcheck-config.yml # <--- put path to configuration file here

