name: Check Links

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    - cron: '30 3 * * 5' # Run every Friday at 3:30 AM UTC

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --skip-missing --glob-ignore-case --hidden --no-ignore './**/*.md' './**/*.html' './**/*.rst'
          fail: true
          format: markdown
          jobSummary: true