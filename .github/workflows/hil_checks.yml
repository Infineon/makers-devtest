name: HIL Checks

on:
  push:
  # workflow_call:
  #   inputs:
  #     project-yaml:
  #       required: true
  #       type: string
  #       description: 'Project Yaml file that consists of build and check configurations'
  #     user-yaml:
  #       required: true
  #       type: string
  #       description: 'User Yaml file with list of build and checks to be executed'

defaults:
  run:
    shell: bash

# permissions:
#   contents: write
    
jobs:
  setup:
    runs-on: ubuntu-24.04

    container:
      # image: docker.io/ifxmakers/makers-docker:latest

      image: ghcr.io/infineon/makers-docker:push #latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

      volumes:
        - .:/myLocalWorkingDir:rw
      options: --cpus 1

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout makers-devops
        uses: actions/checkout@v4
        with:
          repository: Infineon/makers-devops
          path: extras/makers-devops

      - name: Set strategy matrix
        id: set-matrix
        run: |
          # echo $(python3 ./hilChecks.py --projectYAML "config/project.yml" --userYAML "config/user.yml" --getAllChecks)
          eval $(python3 ./hilChecks.py --projectYAML "config/project.yml" --userYAML "config/user.yml" --getAllChecks)
          # eval $(python3 extras/makers-devops/tools/code_checks/codeChecks.py --projectYAML "${{ inputs.project-yaml }}" --userYAML "${{ inputs.user-yaml }}" --getAllChecks)

      # - name: Append HIL Checks Output to Summary
      #   run: |
      #     echo "## 📜 Code Quality Report" >> $GITHUB_STEP_SUMMARY

    outputs:
      checks: ${{ steps.set-matrix.outputs.checks }}
      

  hilChecks:
    runs-on:
      - self-hosted
      - X64
      - Linux
    needs: setup

    container:
      # image: docker.io/ifxmakers/makers-docker:latest

      image: ghcr.io/infineon/makers-docker:push # latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

      volumes:
        - .:/myLocalWorkingDir:rw
        - /opt/hil:/opt/hil:rw
#        -w /myLocalWorkingDir --device=/dev/ttyACM0 --device=/dev/ttyACM1 --device=/dev/ttyACM2

      devices:
        - /dev/ttyACM0: /dev/ttyACM0

      options: --cpus 1

    strategy:
      fail-fast: false

      matrix:
        checks: ${{ fromJson(needs.setup.outputs.checks) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run all code checks
        id: run_build
        run: |
          echo "Workflow has these parameters :"
          echo "matrix.checks   : ${{ matrix.checks }}"
          echo ""
          ls -al
          echo ""

          # export TMPDIR=$HOME/tmp
          # mkdir -p $TMPDIR

          # rm -rf $HOME/artefact
          # mkdir -p $HOME/artefact

          # cd $HOME
          # rm -rf ~/.arduino15/packages/Infineon/hardware/xmc/*
          # ln -s $GITHUB_WORKSPACE ~/.arduino15/packages/Infineon/hardware/xmc/$TEST_VERSION

          # cd extras/arduino-xensiv-3d-magnetic-sensor-tlx493d
          # make -f Makefile.arduino.mk FQBN=Infineon:xmc:XMC1100_XMC2GO PORT=/dev/ttyACM2 UNITY_PATH=../arduino-core-tests/Unity iic compile upload

          python3 /opt/hil/src/python/hil/runQuery.py -s 2>&1 | tee output.log 
          # python3 hilChecks.py --projectYAML "config/project.yml" --userYAML "config/user.yml" --runCheck ${{ matrix.checks }}
          # # python3 extras/makers-devops/tools/code_checks/codeChecks.py --projectYAML "${{ inputs.project-yaml }}" --userYAML "${{ inputs.user-yaml }}" --runCheck ${{ matrix.checks }}
          # > output.log

      - name: Archive code check reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.checks }}
          path: _results

      - name: Append Code Checks Output to Summary
        if: success() || failure()
        run: |
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          cat output.log >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
