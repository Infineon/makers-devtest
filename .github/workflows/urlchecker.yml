name: Check URLs

on:
  pull_request:
  # push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v3

    - name: urls-checker
      uses: urlstechie/urlchecker-action@master
      with:
        # A subfolder or path to navigate to in the present or cloned repository
        subfolder: link_test

        # A comma-separated list of file types to cover in the URL checks
        file_types: .md,.py,.rst,.c,.cpp,.h,.hpp,.py,.html

        # Choose whether to include file with no URLs in the prints.
        print_all: true

        # The timeout seconds to provide to requests, defaults to 5 seconds
        timeout: 5
        verbose: true

        # How many times to retry a failed request (each is logged, defaults to 1)
        retry_count: 3

        # A comma separated links to exclude during URL checks
        exclude_urls: https://www.infineon.com/cms/en/design-support/tools/sdk/modustoolbox-software
        # exclude_urls: https://www.infineon.com/cms/en/design-support/tools/sdk/modustoolbox-software,https://www.infineon.com/cms/en/design-support/documentation

        # A comma separated patterns to exclude during URL checks
        exclude_patterns: https://www.infineon.com/cms/en/design-support/tools/sdk/modustoolbox-software
        # exclude_patterns: https://www.infineon.com/cms/en/design-support/tools/sdk/modustoolbox-software,https://www.infineon.com/cms/en/design-support/documentation

        # choose if the force pass or not
        force_pass : false