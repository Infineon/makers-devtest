code-quality:
    code-quality-clang-tidy:
      description: clang-tidy check sources
      tool: clang-tidy
      # command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh -I src/excludes src/cpp/foo.cpp
      # command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh -I src/excludes --exclude-header-filter '*src/excludes*' src/cpp/foo.cpp
      # command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh -I src/excludes -i src/excludes src/cpp/dummy3.h
      # command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh -I src/excludes -i src/excludes src/cpp/*.[ch]*

      command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh src/cpp/!(c)
      # command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh src/cpp/!(excludes)
      # command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh src/cpp/!(excludes|c)

      # command: extras/makers-devops/tools/code_checks/run_clang_tidy.sh -i src/excludes src/cpp/ok.cpp

    code-quality-cppcheck:
      description: cppcheck check sources
      tool: cppcheck
      command: extras/makers-devops/tools/code_checks/run_cppcheck.sh --no-suppress-default src/c/* src/cpp


example-test:
    example-test-magnetic-w2b6-xmc100_xmc2go:
      - description: Compiling, flashing and monitoring W2B6 unit test for XMC11002Go platform.
        command: make -f Makefile.arduino.mk FQBN=Infineon:xmc:XMC1100_XMC2GO iic compile upload
        query: tlx493d_w2b6 > 0 and type.str.startswith('xmc1100')
        working_dir: extras/arduino-xensiv-3d-magnetic-sensor-tlx493d


unit-test:
    unit-test-magnetic-w2b6-xmc100_xmc2go:
      - description: Compiling, flashing and monitoring W2B6 unit test for XMC11002Go platform.
        command: make -f Makefile.arduino.mk FQBN=Infineon:xmc:XMC1100_XMC2GO iic compile upload
        query: description.str.contains('DPS310') and type.str.startswith('xmc1100')
        working_dir: extras/arduino-xensiv-3d-magnetic-sensor-tlx493d
