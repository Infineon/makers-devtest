check:
    check-clang-tidy:
      description: clang-tidy check sources
      tool: clang-tidy
      command: makers-devops/tools/code_checks/run_clang_tidy.sh -i src/excludes src/c src/cpp

    check-cppcheck:
      description: cppcheck check sources
      tool: cppcheck
      command: makers-devops/tools/code_checks/run_cppcheck.sh --no-suppress-default src/c/* src/cpp  
